name: Linux, gcc, EDK2

on: 
  push:
    paths-ignore:
      - '.gitignore'
      - '.gitattributes'
      - '**.cmd'
      - '!set_grub_cpu.cmd'
      - '**.md'
      - '**.sh'
      - '!set_grub_cpu.sh'
      - '**.txt'
      - '**.vbs'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '.gitattributes'
      - '**.cmd'
      - '!set_grub_cpu.cmd'
      - '**.md'
      - '**.sh'
      - '!set_grub_cpu.sh'
      - '**.txt'
      - '**.vbs'

env:
  BUILD_TYPE: RELEASE
  COMPILER: GCC
  GCC_AARCH64_PREFIX: aarch64-linux-gnu-
  GCC_RISCV64_PREFIX: riscv64-linux-gnu-
  GCC_LOONGARCH64_PREFIX: loongarch64-unknown-linux-gnu-
  EDK2_STABLE_TAG: edk2-stable202608
  LOONGARCH64_TOOLCHAIN_TAG: 2025.08.08
  LOONGARCH64_TOOLCHAIN_NAME: x86_64-cross-tools-loongarch64-binutils_2.45-gcc_15.1.0-glibc_2.42.tar.xz

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        arch: [X64, IA32, AARCH64, RISCV64, LOONGARCH64]
        include:
        - arch: X64
          short: x64
          pkgs: nasm python3-setuptools uuid-dev
        - arch: IA32
          short: ia32
          pkgs: gcc-multilib nasm python3-setuptools uuid-dev
        - arch: AARCH64
          short: aa64
          pkgs: gcc-aarch64-linux-gnu python3-setuptools uuid-dev
        - arch: RISCV64
          short: riscv64
          pkgs: gcc-riscv64-linux-gnu python3-setuptools uuid-dev
        - arch: LOONGARCH64
          short: loongarch64
          pkgs: gcc-multilib python3-setuptools uuid-dev

    steps:
    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install ${{ matrix.pkgs }}
        if [[ "${{ matrix.arch }}" == "LOONGARCH64" ]]; then
          curl -L -O https://github.com/loongson/build-tools/releases/download/${{ env.LOONGARCH64_TOOLCHAIN_TAG }}/${{ env.LOONGARCH64_TOOLCHAIN_NAME }}
          tar -xJf ${{ env.LOONGARCH64_TOOLCHAIN_NAME }}
          echo "$PWD/cross-tools/bin" >> "$GITHUB_PATH"
        fi

    - name: Fix missing Risc-V header
      if: matrix.arch == 'RISCV64'
      run: sudo ln -s /usr/riscv64-linux-gnu/include/gnu/stubs-lp64d.h /usr/riscv64-linux-gnu/include/gnu/stubs-lp64.h

    - name: Set up EDK2
      run: |
        git clone --depth 1 --branch ${EDK2_STABLE_TAG} --recursive https://github.com/tianocore/edk2.git
        make -C edk2/BaseTools

    - name: Checkout repository and submodules
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
        path: edk2/EfiFsPkg

    - name: Patch GRUB
      run: |
        cd edk2/EfiFsPkg/grub
        git apply ../0001-GRUB-fixes.patch

    - name: Build UEFI drivers
      run: |
        cd edk2
        source edksetup.sh
        ./EfiFsPkg/set_grub_cpu.sh ${{ matrix.arch }}
        build -a ${{ matrix.arch }} -b ${{ env.BUILD_TYPE }} -t ${{ env.COMPILER }} -p EfiFsPkg/EfiFsPkg.dsc
        for f in Build/EfiFs/${{ env.BUILD_TYPE }}_${{ env.COMPILER }}/${{ matrix.arch }}/*.efi; do mv "$f" "${f%.efi}_${{ matrix.short }}.efi"; done

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      if: ${{ github.event_name == 'push' }}
      with:
        name: ${{ matrix.short }}
        path: edk2/Build/EfiFs/${{ env.BUILD_TYPE }}_${{ env.COMPILER }}/${{ matrix.arch }}/*.efi

    - name: Display SHA-256
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mv edk2/Build/EfiFs/${{ env.BUILD_TYPE }}_${{ env.COMPILER }}/${{ matrix.arch }}/*.efi .
        sha256sum *.efi

    - name: Create release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      with:
        files: ./*.efi

    - name: Create web artifacts
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        GIT_VERSION=$(git --git-dir edk2/EfiFsPkg/.git describe --tags --abbrev=0)
        DIR_VERSION=${GIT_VERSION:1}
        mkdir -p web/${{ matrix.short }}
        curl -L https://raw.githubusercontent.com/pbatard/efifs/gh-pages/downloads/header.html -o web/${{ matrix.short }}/index.html
        printf "<pre><img src=\"/icons/blank.png\" alt=\"Icon\" width=\"32\" height=\"32\"> Name                       Last modified      Size  Description<hr><a href=\"/downloads/efifs-%s/\"><img src=\"/icons/back.png\" alt=\"[PARENTDIR]\" width=\"32\" height=\"32\"></a> <a href=\"/downloads/efifs-%s/\">Parent Directory</a>                               -\n" ${DIR_VERSION} ${DIR_VERSION} >> web/${{ matrix.short }}/index.html
        for f in *.efi; do
          TIMESTAMP=$(date -r $f "+%Y-%m-%d %H:%M");
          SIZE=$(du --apparent-size -sh $f | awk '{ print $1 }');
          LINK=https://github.com/pbatard/efifs/releases/download/${GIT_VERSION}/$f;
          FILE_AND_TAG="$f</a>";
          printf "<a href=\"%s\"><img src=\"/icons/uefi.svg\" alt=\"[EFI]\" width=\"32\" height=\"32\"></a> <a href=\"%s\">%-31s%-19s%-5s\n" "${LINK}" "${LINK}" "${FILE_AND_TAG}" "${TIMESTAMP}" "${SIZE}" >> web/${{ matrix.short }}/index.html;
        done
        printf "<hr></pre>\n  </body>\n</html>\n" >> web/${{ matrix.short }}/index.html

    - name: Upload web artifacts
      uses: actions/upload-artifact@v7
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: web_files_${{ matrix.short }}
        path: web/*/index.html

  tests:
    runs-on: ubuntu-26.04
    needs: build

    strategy:
      matrix:
        arch: [x64, ia32, aa64, riscv64, loongarch64]
        include:
        - arch: x64
          pkg: qemu-system-x86-hwe
          qemu_arch: x86_64
          qemu_opts: -M q35
          fw_base: OVMF
        - arch: ia32
          pkg: qemu-system-x86-hwe
          qemu_arch: i386
          qemu_opts: -M pc
          fw_base: OVMF
        - arch: aa64
          pkg: qemu-system-arm-hwe
          qemu_arch: aarch64
          qemu_opts: -M virt -cpu cortex-a57
          fw_base: AAVMF
        - arch: riscv64
          pkg: qemu-system-riscv-hwe
          qemu_arch: riscv64
          qemu_opts: -M virt,pflash0=pflash0
          fw_base: QEMU_EFI
        - arch: loongarch64
          pkg: qemu-system-misc-hwe
          qemu_arch: loongarch64
          qemu_opts: -M virt -cpu la464
          fw_base: QEMU_EFI

    steps:
    - name: Set up Linux environment
      run: |
        sudo apt-get update
        sudo apt-get -y --no-install-recommends install ${{ matrix.pkg }}

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.short }}
        path: image/

    - name: Download UEFI firmware
      run: |
        fw_arch=$(echo ${{ matrix.arch }} | tr a-z A-Z)
        fw_zip=${{ matrix.fw_base }}-${fw_arch}.zip
        curl -O https://efi.akeo.ie/${{ matrix.fw_base }}/${fw_zip}
        7z x ${fw_zip}
        rm ${fw_zip}

    - name: Download UEFI Shell
      run: |
        mkdir -p ./image/efi/boot
        curl -L https://github.com/pbatard/UEFI-Shell/releases/download/26H2/shell${{ matrix.arch }}.efi -o ./image/efi/boot/boot${{ matrix.arch }}.efi

    - name: Run tests
      run: |
        export UEFI_ARCH=${{ matrix.arch }}
        if [ "$UEFI_ARCH" = "riscv64" ]; then
          export QEMU_CMD="qemu-system-${{ matrix.qemu_arch }} ${{ matrix.qemu_opts }} -nodefaults -nographic -serial stdio -net none -L . -blockdev node-name=pflash0,driver=file,read-only=on,filename=${{ matrix.fw_base }}.fd -drive format=raw,file=fat:rw:image,id=drv1,if=none -device virtio-blk-device,drive=drv1"
        elif [ "$UEFI_ARCH" = "loongarch64" ]; then
          export QEMU_CMD="qemu-system-${{ matrix.qemu_arch }} ${{ matrix.qemu_opts }} -nodefaults -nographic -serial stdio -net none -L . -bios ${{ matrix.fw_base }}.fd -drive format=raw,file=fat:rw:image"
        else
          export QEMU_CMD="qemu-system-${{ matrix.qemu_arch }} ${{ matrix.qemu_opts }} -nodefaults -nographic -serial stdio -net none -L . -drive if=pflash,format=raw,unit=0,file=${{ matrix.fw_base }}.fd,readonly=on -drive format=raw,file=fat:rw:image"
        fi
        ./tests/run_tests.sh

  merge-release-artifacts:
    runs-on: ubuntu-26.04
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: release_efi_binaries

      - name: Merge Web Artifacts
        uses: actions/upload-artifact/merge@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release_web_files
          delete-merged: true